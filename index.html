<style>
@font-face{font-family:'League Spartan';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/league-spartan-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'League Spartan';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/league-spartan-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Montserrat';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
html,body{margin:0;background:#000;color:#fff}
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;background:radial-gradient(90% 60% at 70% 30%,#1a2a07 0%,#060904 45%,#000 75%);transition:opacity .55s ease,filter .55s ease,transform .55s ease}
#splash.sp-out{opacity:0;filter:blur(6px);transform:scale(1.04);pointer-events:none}
.sp-stage{position:absolute;inset:0;transform:scale(1.08)}
.sp-go .sp-stage{animation:sp-push 3.4s cubic-bezier(.2,.7,.2,1) forwards}
#sp-dust{position:absolute;inset:0;width:100%;height:100%}
.sp-vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.85) 100%);pointer-events:none}
.sp-claws{position:absolute;width:min(96vmin,580px);right:-12vmin;top:max(3vh,env(safe-area-inset-top));filter:drop-shadow(0 0 18px rgba(199,254,81,.55)) drop-shadow(0 0 60px rgba(199,254,81,.25))}
.cl-reveal{stroke-dasharray:var(--l);stroke-dashoffset:var(--l)}
.sp-go .cl-reveal{animation:sp-rip .26s cubic-bezier(.8,0,.2,1) forwards;animation-delay:calc(.45s + var(--d))}
.sp-flash{position:absolute;inset:0;background:radial-gradient(60% 40% at 70% 32%,rgba(214,255,120,.55),transparent 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.sp-go .sp-flash{animation:sp-flash .7s ease-out .72s forwards}
.sp-title{position:absolute;left:clamp(22px,6vw,48px);bottom:calc(21vh + env(safe-area-inset-bottom));margin:0;font:900 clamp(58px,19vw,128px)/.86 'League Spartan','Arial Black',sans-serif;letter-spacing:-.015em;text-transform:uppercase}
.sp-title span{display:block;clip-path:inset(100% 0 0 0);transform:translateY(.35em);color:transparent;background:linear-gradient(100deg,#9ea394 0%,#fff 35%,#fff 48%,#e9ffb8 52%,#fff 56%,#c9cdc1 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text}
.sp-go .sp-title span{animation:sp-wipe .6s cubic-bezier(.2,.8,.2,1) forwards,sp-sheen 1.6s ease-in-out forwards}
.sp-go .sp-title span:nth-child(1){animation-delay:.95s,1.5s}
.sp-go .sp-title span:nth-child(2){animation-delay:1.05s,1.58s}
.sp-go .sp-title span:nth-child(3){animation-delay:1.15s,1.66s}
.sp-go .sp-title span:nth-child(4){animation-delay:1.25s,1.74s}
.sp-line{position:absolute;left:clamp(22px,6vw,48px);bottom:calc(16.5vh + env(safe-area-inset-bottom));height:2px;width:0;background:linear-gradient(90deg,#C7FE51,rgba(199,254,81,0));box-shadow:0 0 12px rgba(199,254,81,.7)}
.sp-go .sp-line{animation:sp-line .9s cubic-bezier(.2,.8,.2,1) 1.7s forwards}
.sp-brand{position:absolute;left:clamp(22px,6vw,48px);bottom:calc(11vh + env(safe-area-inset-bottom));margin:0;font:700 12px/1 Montserrat,system-ui,sans-serif;letter-spacing:.6em;color:#C7FE51;opacity:0;text-transform:uppercase}
.sp-go .sp-brand{animation:sp-track 1.1s cubic-bezier(.2,.8,.2,1) 1.9s forwards}
.sp-sub{position:absolute;left:clamp(22px,6vw,48px);right:clamp(22px,6vw,48px);bottom:calc(5vh + env(safe-area-inset-bottom));max-width:34ch;margin:0;font:500 13px/1.45 Montserrat,system-ui,sans-serif;color:#a9ada3;opacity:0}
.sp-go .sp-sub{animation:sp-fade .6s ease 2.2s forwards}
.sp-go{animation:sp-shake .3s linear .76s 1}
@keyframes sp-push{to{transform:scale(1)}}
@keyframes sp-rip{to{stroke-dashoffset:0}}
@keyframes sp-flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes sp-wipe{to{clip-path:inset(-10% 0 -10% 0);transform:none}}
@keyframes sp-sheen{to{background-position:0 0}}
@keyframes sp-line{to{width:min(62vw,360px)}}
@keyframes sp-track{from{opacity:0;letter-spacing:1.2em}to{opacity:1;letter-spacing:.6em}}
@keyframes sp-fade{to{opacity:1}}
@keyframes sp-shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@media (prefers-reduced-motion:reduce){.sp-go,.sp-go *{animation:none!important}.cl-reveal{stroke-dashoffset:0}.sp-title span{clip-path:none;transform:none}.sp-line{width:min(62vw,360px)}.sp-brand,.sp-sub{opacity:1}.sp-stage{transform:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-stage">
    <canvas id="sp-dust"></canvas>
    <!--CLAWS-->
    <div class="sp-flash"></div>
  </div>
  <div class="sp-vig"></div>
  <h1 class="sp-title"><span>Unleash</span><span>your</span><span>inner</span><span>beast</span></h1>
  <div class="sp-line"></div>
  <p class="sp-brand">Inner Beast</p>
  <p class="sp-sub">Tot ce-ți trebuie ca să ajungi în cea mai bună formă a vieții tale, mental și fizic.</p>
</div>
<div id="app"></div>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c = document.getElementById('sp-dust'), x = c.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1), W = 0, H = 0, P = [], raf = 0, t0 = performance.now(), done = false;
  function size() { W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; }
  size();
  addEventListener('resize', size);
  for (var i = 0; i < 170; i++) { var z = Math.random(); P.push({ x: Math.random(), y: Math.random(), z: z, r: .4 + z * z * 2.6, a: .1 + z * .6, v: .00001 + z * .00012, g: Math.random() < .12 }); }
  x.fillStyle = '#fff';
  function draw(t) {
    var k = Math.min(1, (t - t0) / 500);
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      if (!reduce) { p.y -= p.v * 16; if (p.y < 0) p.y += 1; }
      x.globalAlpha = p.a * k;
      x.fillStyle = p.g ? '#C7FE51' : '#fff';
      x.beginPath(); x.arc(p.x * W, p.y * H, p.r * dpr * (p.g ? 1.6 : 1), 0, 6.2832); x.fill();
    }
    raf = requestAnimationFrame(draw);
  }
  raf = requestAnimationFrame(draw);
  function end() {
    if (done) return;
    done = true;
    sp.classList.add('sp-out');
    setTimeout(function () { cancelAnimationFrame(raf); removeEventListener('resize', size); sp.remove(); }, 460);
  }
  sp.addEventListener('click', end);
  setTimeout(end, reduce ? 1300 : 3500);
  sp.classList.add('sp-go');
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
