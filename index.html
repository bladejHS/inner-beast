<script>
// Before the first paint: always dark (white was tiring on the eyes), and reduced animations if picked in Settings.
(function () {
  var d = document.documentElement;
  d.dataset.theme = 'dark';
  try { if (localStorage.getItem('beast:motion') === 'lite') d.dataset.motion = 'lite'; } catch (e) { /* storage blocked */ }
})();
</script>
<style>
@font-face{font-family:'Saira';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:50% 125%;src:url(fonts/saira-latin-wdth-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Saira';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:50% 125%;src:url(fonts/saira-latin-ext-wdth-normal.woff2) format('woff2-variations');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
html{--sp-bg:#05060a;--sp-fg:#f3f5fa}html[data-theme=dark]{--sp-bg:#05060a;--sp-fg:#f3f5fa}
html,body{margin:0;background:var(--sp-bg);color:var(--sp-fg)}
/* THE ASCENT since 2026-11-21 (splash/zenith.js, the app renamed ZENITH): stars over a horizon, sparks rise and settle
   into the mark while a comet climbs to the peak; at 1.35 s the star at the tip ignites (flash, lens flare, shock
   rings, a light round the dial) and ZENITH is stamped; on the exit the stars streak upward and the mark flies home.
   Since 2026-11-22: GENESIS (splash/zenith.js), about 5.6 s: a jump through hyperspace, the drop-out, mountain ranges
   rising, sparks spiralling into the mark, the ignition at 3.0 s, the afterglow. Before it, THE ASCENT (below).
   Before that, THE IGNITION (splash/ignite.js, retired): a seam of molten light, a vortex of sparks spiralling onto the
   crest, the hammer strike at 1.45 s (flash, shock rings, sparks, slow-motion), the crest white-hot cooling to gold and
   steel while HYBRID FORGE is stamped; the black parts along the seam and the crest flies into the tab bar.
   Before that, THE SPLIT (BeastArena.hybrid) and THE ARENA, about 3.3 s, on the first run and after a new version (engine: splash/arena.js, shared with Beast Nutrition).
   In the dark the wolf's eyes light up; the light rises and the wolf watches over the arena: two fighters trade punches,
   someone does pull-ups, someone push-ups, a runner crosses behind. At 2.0 s the high kick lands (flash, sparks, the
   camera shakes, time slows) and INNER BEAST is stamped under the fight. Then the black rips open along the claw tear and
   the wolf flies home into the tab bar. Tap or Enter skips. Reduced motion, "Animații: Reduse" and Data Saver get the
   still poster: the same arena, frozen on the kick. */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#05070c;color:#f0efea;animation:sp-guard 0s linear 13s forwards;--w:min(88vw,40vh,520px)}
@keyframes sp-guard{to{visibility:hidden;pointer-events:none}}
.sp-half{position:absolute;inset:-3px;background:#05070c}
.sp-a{clip-path:polygon(0 0,100% 0,100% 48%,0 48%)}
.sp-b{clip-path:polygon(0 48%,100% 48%,100% 100%,0 100%)}
.sp-bg{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(60% 30% at 50% 30%,rgba(115,168,238,.16),transparent 70%),radial-gradient(120% 40% at 50% 100%,rgba(120,151,192,.08),transparent 70%),linear-gradient(180deg,#0d0d0d,#070707 60%,#000)}
.sp-go .sp-bg{animation:sp-bgin .9s ease-out .2s forwards}@keyframes sp-bgin{to{opacity:1}}
.sp-stage{position:absolute;left:50%;top:max(4vh,env(safe-area-inset-top));width:var(--w);margin-left:calc(var(--w) / -2);aspect-ratio:680/801;transform-origin:50% 50%;pointer-events:none}
.sp-emb{position:absolute;inset:0;opacity:0}
.sp-emb img{display:block;width:100%;height:100%;filter:drop-shadow(0 0 24px rgba(120,151,192,.3))}
.sp-emb::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%);background-size:300% 100%;background-position:120% 0;-webkit-mask:url(splash/umbra.webp) center/contain no-repeat;mask:url(splash/umbra.webp) center/contain no-repeat;opacity:0}
.sp-hit .sp-emb{animation:sp-cool 1.3s ease-out forwards}
.sp-hit .sp-emb::after{animation:sp-glint .9s ease-in-out .85s forwards}
@keyframes sp-cool{0%{opacity:0;filter:brightness(4) saturate(0);transform:scale(.92)}10%{opacity:1}40%{filter:brightness(1.8) saturate(.6);transform:scale(1.02)}100%{opacity:1;filter:none;transform:none}}
@keyframes sp-glint{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-20% 0}}
.sp-eye{position:absolute;width:19%;aspect-ratio:2.4;margin:-3.96% 0 0 -9.5%;border-radius:50%;transform:rotate(var(--r));opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(closest-side,#fff 0,#e2edfa 9%,#99b5d9 22%,rgba(153,181,217,.32) 42%,transparent 70%)}
.sp-eye{display:none}
#sp-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sp-flash,.sp-vig{position:absolute;inset:0;pointer-events:none}
.sp-vig{background:radial-gradient(130% 95% at 50% 42%,transparent 45%,rgba(0,0,0,.8) 100%)}
.sp-flash{background:radial-gradient(circle at var(--ix,50%) var(--iy,55%),#fff 0,#fff 3%,rgba(229,238,250,.85) 10%,rgba(153,181,217,.38) 26%,rgba(5,6,10,0) 50%);opacity:0}
.sp-id{position:absolute;left:0;right:0;bottom:max(7vh,calc(env(safe-area-inset-bottom) + 34px));display:grid;justify-items:center;gap:clamp(8px,1.4vh,13px);pointer-events:none}
.sp-name{margin:0;font:800 expanded clamp(40px,12.5vw,78px)/.9 'Saira','Arial Narrow',sans-serif;letter-spacing:.22em;margin-right:-.22em;text-transform:uppercase;white-space:nowrap}
.sp-name i{display:inline-block;font-style:normal;opacity:0;color:#f3f5fa;text-shadow:0 0 0 transparent}
.sp-name .b{color:#b9d0f0}
.sp-name .sp-gap{width:.28em}
.sp-rule{display:block;width:min(58vw,300px);height:4px;background:linear-gradient(90deg,transparent,#7897c0 18%,#99b5d9 50%,#7897c0 82%,transparent);transform:skewX(-30deg) scaleX(0);opacity:0}
.sp-tag{margin:0;font:700 semi-expanded clamp(10.5px,2.9vw,13.5px)/1.2 'Saira',system-ui,sans-serif;letter-spacing:.3em;margin-right:-.3em;color:#b7bfca;white-space:nowrap;opacity:0}
.sp-skip{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));padding:12px 14px;border:0;background:none;color:#b7bfca;font:700 semi-expanded 11.5px/1 'Saira',system-ui,sans-serif;letter-spacing:.2em;cursor:pointer;opacity:0;transition:opacity .3s}
.sp-skip:focus-visible{outline:2px solid #99b5d9;opacity:1}
#sp-tear{position:fixed;inset:0;z-index:101;width:100%;height:100%;pointer-events:none;opacity:0}
#sp-tear polyline{fill:none;stroke:#80b0ef;stroke-width:4;stroke-linejoin:bevel}
#sp-tear .core{stroke:#eef4fc;stroke-width:1.2}

/* the impact, keyed off .sp-hit (the engine calls the page when the kick lands) */
.sp-go .sp-skip,.sp-calm .sp-skip{opacity:.85}
.sp-hit .sp-flash{animation:sp-flash .55s cubic-bezier(.16,1,.3,1) both}
.sp-hit .sp-name i{animation:sp-stamp .42s cubic-bezier(.2,1.4,.3,1) var(--d) forwards}
.sp-hit .sp-rule{animation:sp-rule .34s cubic-bezier(.7,0,.2,1) .66s forwards}
.sp-hit .sp-tag{animation:sp-flicker .5s steps(1) .78s forwards}
@keyframes sp-flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
@keyframes sp-stamp{0%{opacity:0;transform:translateY(-.35em) scale(1.5);color:#fff;text-shadow:0 0 24px #80b0ef,0 0 6px #fff}35%{opacity:1}70%{text-shadow:0 0 14px rgba(128,176,239,.6)}100%{opacity:1;transform:none;text-shadow:0 0 0 transparent}}
@keyframes sp-rule{to{opacity:1;transform:skewX(-30deg)}}
@keyframes sp-flicker{0%{opacity:.8}12%{opacity:.1}24%{opacity:.9}36%{opacity:.25}52%,100%{opacity:1}}

/* the still poster */
.sp-calm .sp-bg{opacity:1}.sp-calm .sp-emb{opacity:1}
.sp-calm .sp-name i,.sp-calm .sp-tag{opacity:1}.sp-calm .sp-rule{opacity:1;transform:skewX(-30deg)}
#splash.sp-fade{animation:none;opacity:0;transition:opacity .26s linear;pointer-events:none}

/* the exit: the arena goes dark, the wolf flies home to the tab bar, the black rips apart along the claw tear */
#splash.sp-exit{background:transparent;pointer-events:none}
#splash.sp-exit .sp-a{animation:sp-rip-a .6s cubic-bezier(.7,0,.2,1) forwards}
#splash.sp-exit .sp-b{animation:sp-rip-b .6s cubic-bezier(.7,0,.2,1) forwards}
#splash.sp-exit .sp-id,#splash.sp-exit .sp-skip,#splash.sp-exit .sp-vig,#splash.sp-exit .sp-bg,#splash.sp-exit .sp-eye{animation:sp-out .2s ease-out forwards}
#splash.sp-exit #sp-cv{animation:sp-out .55s ease-in forwards}
#splash.sp-exit.sp-land .sp-stage{animation:sp-fly .58s cubic-bezier(.55,0,.15,1) forwards}
#splash.sp-exit:not(.sp-land) .sp-stage{animation:sp-out .3s ease-out forwards}
#sp-tear.sp-exit{animation:sp-tear .5s ease-out forwards}
@keyframes sp-rip-a{0%{transform:none}100%{transform:translateY(-100%)}}
@keyframes sp-rip-b{0%{transform:none}100%{transform:translateY(100%)}}
@keyframes sp-fly{to{transform:translate(var(--fx),var(--fy)) scale(var(--fs))}}
@keyframes sp-out{to{opacity:0}}
@keyframes sp-tear{0%{opacity:0}12%{opacity:1}60%{opacity:.8}100%{opacity:0}}
.sp-fail{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;font:600 15px/1.4 'Saira',system-ui,sans-serif;color:#f3f5fa}
.sp-fail a{color:#99b5d9;font-weight:700}
</style>
</head>
<body>
<div id="splash">
  <div class="sp-half sp-a" aria-hidden="true"></div>
  <div class="sp-half sp-b" aria-hidden="true"></div>
  <div class="sp-bg" aria-hidden="true"></div>
  <div class="sp-stage" aria-hidden="true">
    <div class="sp-emb"><img src="splash/umbra.webp" alt="" width="680" height="801" decoding="sync"></div>
    <i class="sp-eye l"></i><i class="sp-eye r"></i>
  </div>
  <canvas id="sp-cv" aria-hidden="true"></canvas>
  <div class="sp-vig" aria-hidden="true"></div>
  <div class="sp-id">
    <p class="sp-name" aria-label="Zenith"><i style="--d:0.16s">Z</i><i style="--d:0.22s">E</i><i style="--d:0.28s">N</i><i class="b" style="--d:0.34s">I</i><i class="b" style="--d:0.40s">T</i><i class="b" style="--d:0.46s">H</i></p>
    <i class="sp-rule" aria-hidden="true"></i>
    <p class="sp-tag">RUN · LIFT · ASCEND</p>
  </div>
  <div class="sp-flash" aria-hidden="true"></div>
  <button class="sp-skip" type="button" aria-label="Sari peste intro">SARI</button>
</div>
<svg id="sp-tear" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="0,48 100,48" vector-effect="non-scaling-stroke"/><polyline class="core" points="0,48 100,48" vector-effect="non-scaling-stroke"/></svg>
<div id="app"></div>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// The full opening plays on the first run and after a new version; a normal launch shows the wolf at once and fades in 240 ms
// (Apple: launch instantly; a splash belongs to the first run). Settings: Automat (default), Mereu, Scurt, Oprit.
// A reload in the same session skips it. main.ts builds the dashboard underneath at the same time, so the exit only waits
// if that is genuinely not ready. The exit sends 'beast:reveal' (the app's entry starts) and 'beast:landed' (the wolf in
// the tab bar roars), which main.ts listens for. The arena is drawn by splash/arena.js, shared with Beast Nutrition.
(function () {
  var sp = document.getElementById('splash'), tear = document.getElementById('sp-tear');
  if (!sp) return;
  var VERSION = '2026-11-22g', mode = 'auto', seen = false, known = '', boot = performance.now();
  try { mode = localStorage.getItem('beast:opening') || 'auto'; known = localStorage.getItem('beast:opened-v') || ''; } catch (e) { /* storage blocked */ }
  try { seen = sessionStorage.getItem('beast:opened') === '1'; sessionStorage.setItem('beast:opened', '1'); } catch (e) { /* storage blocked */ }
  var forge = null;
  function drop() { if (forge) forge.destroy(); sp.remove(); if (tear) tear.remove(); }
  function ready() { var a = document.getElementById('app'); return !!a && a.children.length > 0; }
  if (seen || mode === 'off') { drop(); return; }
  if (mode === 'auto' && known === VERSION) {
    sp.classList.add('sp-calm'); poster();
    (function wait() { if (ready() || performance.now() - boot > 600) { sp.classList.add('sp-fade'); setTimeout(drop, 240); } else setTimeout(wait, 30); })();
    return;
  }
  try { localStorage.setItem('beast:opened-v', VERSION); } catch (e) { /* storage blocked */ }
  var conn = navigator.connection;
  var calm = mode === 'short' || matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'lite' || !!(conn && conn.saveData) || !window.BeastIgnite;
  var HOLD = calm ? 1100 : 5600, LIMIT = 9000;
  var t0 = 0, started = false, leaving = false, broken = false;
  addEventListener('error', function (e) { if (e.error || (e.target && e.target.tagName === 'SCRIPT')) broken = true; }, true);
  function say(name) { try { dispatchEvent(new Event(name)); } catch (e) { /* old browser */ } }
  // the wolf flies to where it lives: its hexagon at the end of the tab bar
  function land() {
    var st = sp.querySelector('.sp-stage'), home = document.querySelector('#nav .nw-hex img');
    if (!st || !home) return;
    var a = st.getBoundingClientRect(), b = home.getBoundingClientRect();
    if (!a.width || !b.width) return;
    st.style.setProperty('--fx', (b.left + b.width / 2 - (a.left + a.width / 2)).toFixed(1) + 'px');
    st.style.setProperty('--fy', (b.top + b.height / 2 - (a.top + a.height / 2)).toFixed(1) + 'px');
    st.style.setProperty('--fs', (b.width / a.width).toFixed(4));
    sp.classList.add('sp-land');
  }
  function leave() {
    if (leaving) return;
    if (!ready() && !broken && performance.now() - t0 < LIMIT) { setTimeout(leave, 60); return; }
    leaving = true;
    if (!ready()) {
      var app = document.getElementById('app');
      if (app) app.innerHTML = '<div class="sp-fail"><p>Aplicația nu s-a putut încărca.</p><a href="./">Încearcă din nou</a></div>';
    }
    if (calm || !ready()) { sp.classList.add('sp-fade'); setTimeout(drop, 280); return; }
    if (forge) forge.burst();
    land();
    sp.classList.add('sp-exit');
    if (tear) tear.classList.add('sp-exit');
    say('beast:reveal');
    setTimeout(function () { drop(); say('beast:landed'); }, 620);
  }
  function go() {
    if (started) return;
    started = true;
    t0 = performance.now();
    if (calm) { sp.classList.add('sp-calm'); poster(); setTimeout(leave, HOLD); return; }
    sp.classList.add('sp-go');
    forge = arena(function () { sp.classList.add('sp-hit'); try { navigator.vibrate && navigator.vibrate([30, 40, 60]); } catch (e) { /* not here */ } });
    forge.start();
    setTimeout(leave, HOLD);
  }
  function arena(hit) {
    return window.BeastIgnite.create({ canvas: document.getElementById('sp-cv'), stage: sp.querySelector('.sp-stage'), root: sp, color: [120, 151, 192], hot: [159, 192, 236], onImpact: hit });
  }
  // the calm poster is the same scene, frozen just after the finish beam breaks
  function poster() { if (!window.BeastIgnite) return; try { forge = arena(null); forge.still(4.6); } catch (e) { /* the wolf and the name are enough */ } }
  // Starts once main.ts has drawn the dashboard, so that work does not stutter the sparks; after half a second it runs anyway.
  function arm() {
    if (started) return;
    if (ready() || performance.now() - boot > 500) { requestAnimationFrame(go); return; }
    setTimeout(arm, 25);
  }
  arm();
  function skip() { if (!started) go(); t0 = t0 || performance.now(); leave(); }
  sp.addEventListener('click', skip);
  addEventListener('keydown', function k(e) {
    if (!sp.isConnected) { removeEventListener('keydown', k); return; }
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') skip();
  });
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
