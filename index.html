<script>
// Theme before the first paint: the saved choice, otherwise the phone's setting.
(function () {
  // always dark: white was tiring on the eyes

<style>
@font-face{font-family:'League Spartan';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/league-spartan-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'League Spartan';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/league-spartan-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Montserrat';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
html{--sp-bg:#f3f1ec;--sp-fg:#0d0d0d}html[data-theme=dark]{--sp-bg:#090a0c;--sp-fg:#efece6}
html,body{margin:0;background:var(--sp-bg);color:var(--sp-fg)}
/* Opening, 2 s. 0–.25 three hairline crimson fractures and a red pulse in the dark; .25–.65 three claws tear through
   with a flash and one impact shake; .65–1.1 black metal shards pull in and lock into the wolf, its eyes ignite, a shockwave;
   1.1–1.45 a cold silver light sweeps the face; 1.45–1.8 INNER BEAST; 1.8–2 the eyes pulse once, the red contracts, hand-over. */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#050505;color:#efede8;transition:opacity .3s ease;display:grid;place-items:center}
#splash.sp-out{opacity:0;pointer-events:none}
.sp-cam{position:absolute;inset:0;display:grid;place-items:center}
.sp-go .sp-cam{animation:sp-push 2s cubic-bezier(.2,.6,.2,1) both,sp-hit .2s linear .5s}
.sp-stage{position:relative;width:min(76vw,380px);aspect-ratio:1;margin-top:-12vh}
.sp-pulse{position:absolute;inset:-40%;background:radial-gradient(closest-side,rgba(117,0,16,.55),rgba(117,0,16,.15) 50%,transparent 75%);opacity:0}
.sp-go .sp-pulse{animation:sp-pulse 2s ease-out both}
/* the claw marks: a black groove with crimson burning inside the edges */
.sp-claws{position:absolute;inset:-22%}
.sp-claws i{position:absolute;left:4%;width:92%;height:10px;transform-origin:0 50%;transform:rotate(-40deg) scaleX(0);border-radius:50%;
  background:linear-gradient(180deg,transparent,#c10f25 30%,#050505 46%,#050505 54%,#c10f25 70%,transparent);
  box-shadow:0 0 10px rgba(193,15,37,.9),0 0 34px rgba(117,0,16,.8);clip-path:polygon(0 50%,8% 20%,30% 8%,62% 0,90% 25%,100% 50%,90% 75%,62% 100%,30% 92%,8% 80%)}
.sp-claws i:nth-child(1){top:32%}.sp-claws i:nth-child(2){top:48%}.sp-claws i:nth-child(3){top:64%}
.sp-go .sp-claws i{animation:sp-hair .2s ease-out both,sp-tear .2s cubic-bezier(.85,0,.15,1) .3s forwards,sp-burn 1.6s ease .5s forwards}
.sp-go .sp-claws i:nth-child(2){animation-delay:.04s,.34s,.54s}.sp-go .sp-claws i:nth-child(3){animation-delay:.08s,.38s,.58s}
.sp-flash{position:absolute;inset:-60%;background:radial-gradient(closest-side,rgba(193,15,37,.5),transparent 70%);opacity:0}
.sp-go .sp-flash{animation:sp-flash .35s ease-out .42s both}
.sp-frag{position:absolute;left:50%;top:50%;width:6px;height:6px;background:#1a1a1a;box-shadow:0 0 0 1px #2a2a2a;opacity:0}
.sp-frag:nth-child(1){--fx:-150px;--fy:-90px}.sp-frag:nth-child(2){--fx:140px;--fy:-120px}.sp-frag:nth-child(3){--fx:-120px;--fy:130px}
.sp-frag:nth-child(4){--fx:160px;--fy:80px}.sp-frag:nth-child(5){--fx:-30px;--fy:-170px}.sp-frag:nth-child(6){--fx:40px;--fy:170px}
.sp-go .sp-frag{animation:sp-frag .6s cubic-bezier(.2,.8,.2,1) .45s both}
.sp-wave{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:1.5px solid rgba(193,15,37,.7);opacity:0}
.sp-go .sp-wave{animation:sp-wave .65s ease-out .98s both}
/* the wolf, assembled from six shards of black metal */
.sp-emb{position:absolute;inset:0}
.sp-sh{position:absolute;inset:0;opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.15);filter:brightness(.2) blur(4px)}
.sp-sh img{display:block;width:100%;height:100%;-webkit-mask:radial-gradient(closest-side,#000 72%,transparent 99%);mask:radial-gradient(closest-side,#000 72%,transparent 99%)}
.sp-sh:nth-child(1){clip-path:polygon(0 0,50% 0,50% 45%,0 38%);--x:-60%;--y:-50%;--r:-24deg}
.sp-sh:nth-child(2){clip-path:polygon(50% 0,100% 0,100% 38%,50% 45%);--x:60%;--y:-50%;--r:22deg}
.sp-sh:nth-child(3){clip-path:polygon(0 38%,50% 45%,50% 72%,0 66%);--x:-75%;--y:6%;--r:-16deg}
.sp-sh:nth-child(4){clip-path:polygon(50% 45%,100% 38%,100% 66%,50% 72%);--x:75%;--y:6%;--r:18deg}
.sp-sh:nth-child(5){clip-path:polygon(0 66%,50% 72%,50% 100%,0 100%);--x:-50%;--y:60%;--r:20deg}
.sp-sh:nth-child(6){clip-path:polygon(50% 72%,100% 66%,100% 100%,50% 100%);--x:50%;--y:60%;--r:-20deg}
.sp-go .sp-sh{animation:sp-gather .4s cubic-bezier(.7,0,.25,1) .65s forwards}
.sp-go .sp-emb{animation:sp-lock .22s linear 1.05s}
.sp-sheen{position:absolute;inset:0;pointer-events:none;-webkit-mask:url(splash/emblem.webp) center/100% 100%;mask:url(splash/emblem.webp) center/100% 100%;background:linear-gradient(105deg,transparent 42%,rgba(214,224,235,.8) 50%,transparent 58%) 0 0/300% 100% no-repeat;background-position:100% 0;mix-blend-mode:screen;opacity:0}
.sp-go .sp-sheen{animation:sp-sheen .35s ease-in-out 1.1s}
.sp-eye{position:absolute;top:47.5%;width:11%;aspect-ratio:1.6;margin:-3% 0 0 -5.5%;border-radius:50%;background:radial-gradient(closest-side,#fff 0,#ff4a55 35%,rgba(193,15,37,.6) 60%,transparent);opacity:0;mix-blend-mode:screen}
.sp-eye.l{left:41.5%}.sp-eye.r{left:58.5%}
.sp-go .sp-eye{animation:sp-eye .45s ease-out .95s both,sp-blink .2s ease-in-out 1.82s}
.sp-ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#c10f25;box-shadow:0 0 6px #c10f25;opacity:0}
.sp-ember:nth-of-type(1){left:30%;top:70%}.sp-ember:nth-of-type(2){left:66%;top:62%}.sp-ember:nth-of-type(3){left:48%;top:78%}.sp-ember:nth-of-type(4){left:22%;top:40%}
.sp-go .sp-ember{animation:sp-ember 1.1s ease-out 1s both}
.sp-go .sp-ember:nth-of-type(2){animation-delay:1.08s}.sp-go .sp-ember:nth-of-type(3){animation-delay:1.16s}.sp-go .sp-ember:nth-of-type(4){animation-delay:.2s}
.sp-title{position:absolute;left:0;right:0;top:calc(50% + min(38vw,190px) - 12vh + 26px);margin:0;text-align:center;font:900 clamp(34px,10.5vw,56px)/1 'League Spartan','Arial Black',sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:0;transform:translateY(8px);
  background:linear-gradient(180deg,#f4f2ee 0%,#bfc3c8 55%,#8d9298 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-title span{background:linear-gradient(180deg,#e0414c,#901a25);-webkit-background-clip:text;background-clip:text}
.sp-go .sp-title{animation:sp-title .3s cubic-bezier(.2,.8,.2,1) 1.45s forwards}
.sp-line{position:absolute;left:50%;top:calc(50% + min(38vw,190px) - 12vh + 86px);width:min(56vw,260px);height:2px;margin-left:min(-28vw,-130px);background:linear-gradient(90deg,transparent,#c10f25,transparent);transform:scaleX(0);opacity:0}
.sp-go .sp-line{animation:sp-line .6s ease 1.5s forwards}
@keyframes sp-push{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes sp-hit{0%,100%{translate:0 0}25%{translate:-6px 3px}50%{translate:5px -3px}75%{translate:-2px 1px}}
@keyframes sp-pulse{0%{opacity:0}10%{opacity:.9}30%{opacity:.35}55%{opacity:.7}90%{opacity:.25}100%{opacity:0}}
@keyframes sp-hair{from{opacity:0;transform:rotate(-40deg) scaleX(0)}to{opacity:.8;transform:rotate(-40deg) scaleX(.18) scaleY(.25)}}
@keyframes sp-tear{from{transform:rotate(-40deg) scaleX(.18) scaleY(.25)}to{opacity:1;transform:rotate(-40deg) scaleX(1) scaleY(1)}}
@keyframes sp-burn{0%{opacity:1}60%{opacity:.55}100%{opacity:.12;filter:saturate(.5)}}
@keyframes sp-flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes sp-frag{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(220deg)}}
@keyframes sp-gather{0%{opacity:0}35%{opacity:1}100%{opacity:1;transform:none;filter:none}}
@keyframes sp-lock{0%,100%{transform:scale(1)}35%{transform:scale(.965)}70%{transform:scale(1.008)}}
@keyframes sp-wave{0%{opacity:.85;transform:scale(.4)}100%{opacity:0;transform:scale(10)}}
@keyframes sp-sheen{0%{opacity:1;background-position:100% 0}100%{opacity:1;background-position:0 0}}
@keyframes sp-eye{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(2)}100%{opacity:.85;transform:scale(1)}}
@keyframes sp-blink{50%{opacity:1;transform:scale(1.45)}}
@keyframes sp-ember{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}100%{opacity:0;transform:translate(6px,-60px)}}
@keyframes sp-title{to{opacity:1;transform:none}}
@keyframes sp-line{0%{opacity:0;transform:scaleX(0)}50%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(.02)}}
@media (prefers-reduced-motion:reduce){.sp-go *{animation:none!important}.sp-sh{opacity:1;transform:none;filter:none}.sp-title{opacity:1;transform:none}.sp-eye{opacity:.85}.sp-claws i{transform:rotate(-40deg) scaleX(1);opacity:.12}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-cam">
    <div class="sp-stage">
      <div class="sp-pulse"></div>
      <div class="sp-claws"><i></i><i></i><i></i></div>
      <div class="sp-flash"></div>
      <div><i class="sp-frag"></i><i class="sp-frag"></i><i class="sp-frag"></i><i class="sp-frag"></i><i class="sp-frag"></i><i class="sp-frag"></i></div>
      <div class="sp-wave"></div>
      <div class="sp-emb">
        <div class="sp-sh"><img src="splash/emblem.webp" alt="" width="640" height="640" decoding="async"></div><div class="sp-sh"><img src="splash/emblem.webp" alt="" width="640" height="640" decoding="async"></div><div class="sp-sh"><img src="splash/emblem.webp" alt="" width="640" height="640" decoding="async"></div><div class="sp-sh"><img src="splash/emblem.webp" alt="" width="640" height="640" decoding="async"></div><div class="sp-sh"><img src="splash/emblem.webp" alt="" width="640" height="640" decoding="async"></div><div class="sp-sh"><img src="splash/emblem.webp" alt="" width="640" height="640" decoding="async"></div>
        <div class="sp-sheen"></div>
        <i class="sp-eye l"></i><i class="sp-eye r"></i>
      </div>
      <i class="sp-ember"></i><i class="sp-ember"></i><i class="sp-ember"></i><i class="sp-ember"></i>
    </div>
    <p class="sp-title">Inner <span>Beast</span></p>
    <i class="sp-line"></i>
  </div>
</div>
<div id="app"></div>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var started = false, done = false;
  function end() {
    if (done) return;
    done = true;
    sp.classList.add('sp-out');
    setTimeout(function () { sp.remove(); }, 400);
  }
  function go() {
    if (started) return;
    started = true;
    sp.classList.add('sp-go');
    setTimeout(end, reduce ? 900 : 2000);
  }
  // start once the emblem is in, but never hold the app hostage to a slow image
  var im = new Image();
  im.onload = im.onerror = go;
  im.src = 'splash/emblem.webp';
  sp.addEventListener('click', end);
  setTimeout(go, 700);
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
