<script>
// Theme before the first paint: the saved choice, otherwise the phone's setting.
(function () {
  var t = null;
  try { t = localStorage.getItem('beast:theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f0f0f');
})();
</script>
<style>
@font-face{font-family:'League Spartan';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/league-spartan-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'League Spartan';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/league-spartan-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Montserrat';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Montserrat';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
html{--sp-bg:#f3f1ec;--sp-fg:#0d0d0d}html[data-theme=dark]{--sp-bg:#0f0f0f;--sp-fg:#efece6}
html,body{margin:0;background:var(--sp-bg);color:var(--sp-fg)}
/* Opening: the wolf over the wanderer comes out of the dark, the lettering is torn in, hits, and a light runs through it. */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#000;color:#efece6;transition:clip-path .6s cubic-bezier(.7,0,.2,1),opacity .6s;clip-path:inset(0 0 0 0)}
#splash.sp-out{clip-path:inset(0 0 100% 0);pointer-events:none}
.sp-stage{position:absolute;inset:0}
.sp-bg{position:absolute;inset:-3%;background:#000 url(splash/bg.webp) 50% 30%/cover no-repeat;opacity:0;transform:scale(1.18);filter:brightness(.4) contrast(1.15)}
.sp-go .sp-bg{animation:sp-bg 4.6s cubic-bezier(.2,.7,.2,1) forwards}
.sp-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 30%,transparent 50%,rgba(0,0,0,.85) 82%,#000)}
.sp-go .sp-stage{animation:sp-hit .34s linear 1.55s 1}
.sp-logo{position:absolute;left:50%;bottom:calc(17vh + env(safe-area-inset-bottom));width:min(94vw,560px);aspect-ratio:1100/367;margin:0;transform:translateX(-50%)}
.sp-logo img{display:block;width:100%;height:100%;opacity:0;clip-path:inset(0 100% 0 0);transform:scale(1.25) rotate(-4deg);filter:blur(10px) drop-shadow(0 0 0 rgba(255,255,255,0))}
.sp-go .sp-logo img{animation:sp-tear .55s cubic-bezier(.7,0,.25,1) 1s forwards,sp-glow 2.4s ease-in-out 2.6s infinite alternate}
.sp-logo::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) 0 0/300% 100% no-repeat;background-position:100% 0;-webkit-mask:url(splash/title.webp) center/100% 100% no-repeat;mask:url(splash/title.webp) center/100% 100% no-repeat;opacity:0;mix-blend-mode:screen}
.sp-go .sp-logo::after{animation:sp-sheen .9s ease-in-out 1.9s forwards}
.sp-brand{position:absolute;left:0;right:0;bottom:calc(13vh + env(safe-area-inset-bottom));margin:0;text-align:center;font:900 12px/1 'League Spartan',sans-serif;letter-spacing:.55em;color:#efece6;opacity:0;text-transform:uppercase}
.sp-go .sp-brand{animation:sp-fade .4s ease 2.5s forwards}
.sp-sub{position:absolute;left:clamp(22px,6vw,48px);right:clamp(22px,6vw,48px);bottom:calc(5vh + env(safe-area-inset-bottom));max-width:34ch;margin:0 auto;text-align:center;font:600 13px/1.45 Montserrat,system-ui,sans-serif;color:#efece6;opacity:0}
.sp-go .sp-sub{animation:sp-fade-sub .6s ease 2.7s forwards}
@keyframes sp-bg{0%{opacity:0;transform:scale(1.18);filter:brightness(.4) contrast(1.15)}35%{opacity:1}100%{opacity:1;transform:scale(1.02);filter:brightness(.95) contrast(1.05)}}
@keyframes sp-tear{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:scale(1.25) rotate(-4deg);filter:blur(10px)}55%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(2px)}80%{transform:scale(.97) rotate(.5deg)}100%{opacity:1;clip-path:inset(0 0 0 0);transform:none;filter:blur(0) drop-shadow(0 0 0 rgba(255,255,255,0))}}
@keyframes sp-glow{from{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}to{filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}}
@keyframes sp-sheen{0%{opacity:1;background-position:100% 0}100%{opacity:1;background-position:0 0}}
@keyframes sp-fade-sub{to{opacity:.75}}
@keyframes sp-hit{0%,100%{transform:none}15%{transform:translate(-7px,4px) scale(1.012)}35%{transform:translate(6px,-4px)}55%{transform:translate(-4px,2px)}75%{transform:translate(2px,-1px)}}
@keyframes sp-fade{to{opacity:.8}}
@media (prefers-reduced-motion:reduce){.sp-go *,.sp-go .sp-logo::after{animation:none!important}.sp-bg{opacity:1;transform:none;filter:none}.sp-logo img{opacity:1;clip-path:none;transform:none;filter:none}.sp-brand,.sp-sub{opacity:.8}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sp-stage">
    <div class="sp-bg"></div>
    <div class="sp-shade"></div>
    <h1 class="sp-logo"><img src="splash/title.webp" alt="Unleash your inner beast" width="1100" height="367" decoding="async"></h1>
  </div>
  <p class="sp-brand">Inner Beast</p>
  <p class="sp-sub">Tot ce-ți trebuie ca să ajungi în cea mai bună formă a vieții tale, mental și fizic.</p>
</div>
<div id="app"></div>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (!sp) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var started = false, done = false, left = 2;
  function end() {
    if (done) return;
    done = true;
    sp.classList.add('sp-out');
    setTimeout(function () { sp.remove(); }, 650);
  }
  function go() {
    if (started) return;
    started = true;
    sp.classList.add('sp-go');
    setTimeout(end, reduce ? 1400 : 4300);
  }
  // start once the picture and the lettering are in, but never hold the app hostage to a slow image
  function ready() { if (--left <= 0) go(); }
  ['splash/bg.webp', 'splash/title.webp'].forEach(function (src) {
    var im = new Image();
    im.onload = im.onerror = ready;
    im.src = src;
  });
  sp.addEventListener('click', end);
  setTimeout(go, 1200);
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
