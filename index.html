<style>

@font-face{font-family:'Barlow Condensed';font-style:normal;font-display:swap;font-weight:700 900;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
html{--sp-bg:#f3f1ec;--sp-fg:#0d0d0d}html[data-theme=dark]{--sp-bg:#050404;--sp-fg:#f6f0ee}
html,body{margin:0;background:var(--sp-bg);color:var(--sp-fg)}
/* BEAST AWAKENING, about 2.5 s. 0–.4 darkness, red smoke, slow dust; .4–.9 a crimson streak crosses and reveals the wolf;
   .9–1.5 the wolf comes up with one pulse and a metal sheen; 1.5–2 INNER BEAST and the tagline; 2–2.5 a red slash opens the app.
   Only transform, opacity and clip-path move, so the compositor can do the work. Scripted below. */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#050404;color:#f6f0ee;animation:sp-guard 0s linear 9s forwards}
@keyframes sp-guard{to{visibility:hidden;pointer-events:none}}
.sp-smoke,.sp-dust,.sp-sparks,.sp-beam{position:absolute;inset:0;pointer-events:none}
.sp-smoke{opacity:0}
.sp-smoke b{position:absolute;width:120vmax;height:120vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(70,10,16,.62),rgba(9,7,7,.3) 55%,transparent 72%);will-change:transform}
.sp-smoke b:nth-child(1){left:-70vmax;top:-30vmax}.sp-smoke b:nth-child(2){right:-74vmax;top:-12vmax}.sp-smoke b:nth-child(3){left:-30vmax;bottom:-84vmax}
.sp-go .sp-smoke{animation:sp-in .5s ease-out both}
.sp-go .sp-smoke b:nth-child(1){animation:sp-drift1 2.6s linear both}.sp-go .sp-smoke b:nth-child(2){animation:sp-drift2 2.6s linear both}.sp-go .sp-smoke b:nth-child(3){animation:sp-drift3 2.6s linear both}
.sp-dust i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#ff3b2f;opacity:0}
.sp-go .sp-dust i{animation:sp-dust 2.3s linear var(--d) both}
.sp-beam{opacity:0;background:linear-gradient(114deg,transparent 30%,rgba(192,20,29,.2) 49%,rgba(255,59,47,.08) 53%,transparent 68%)}
.sp-go .sp-beam{animation:sp-beam 1.5s ease-out .42s both}
.sp-cam{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:clamp(12px,2.6vh,26px);--w:min(66vw,40vh,360px)}
.sp-stage{position:relative;width:var(--w);aspect-ratio:680/801}
.sp-halo,.sp-pulse{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;opacity:0}
.sp-halo{width:170%;aspect-ratio:1;margin:-85% 0 0 -85%;background:radial-gradient(closest-side,rgba(192,20,29,.3),rgba(192,20,29,.08) 55%,transparent 74%)}
.sp-pulse{width:120%;aspect-ratio:1;margin:-60% 0 0 -60%;background:radial-gradient(closest-side,rgba(255,59,47,.5),rgba(192,20,29,.26) 46%,transparent 72%)}
.sp-go .sp-halo{animation:sp-in .5s ease-out .5s both}
.sp-go .sp-pulse{animation:sp-pulse .6s cubic-bezier(.2,.7,.2,1) .98s both}
.sp-emb{position:absolute;inset:0;clip-path:polygon(-40% -10%,-40% -10%,-70% 110%,-70% 110%);transform:scale(1.07);will-change:transform,clip-path}
.sp-go .sp-emb{animation:sp-reveal .46s cubic-bezier(.6,0,.3,1) .44s forwards,sp-settle .62s cubic-bezier(.16,.8,.24,1) .9s forwards}
.sp-rim{position:absolute;inset:0;opacity:.46;filter:drop-shadow(0 0 1px rgba(255,59,47,.85)) drop-shadow(0 0 14px rgba(192,20,29,.5))}
.sp-rim img{display:block;width:100%;height:100%}
.sp-go .sp-rim{animation:sp-wake .5s ease-out .92s forwards}
.sp-sheen{position:absolute;inset:0;overflow:hidden;-webkit-mask:url(splash/emblem.webp) center/100% 100% no-repeat;mask:url(splash/emblem.webp) center/100% 100% no-repeat}
.sp-sheen i{position:absolute;inset:-10% -70%;background:linear-gradient(104deg,transparent 45%,rgba(255,222,214,.72) 50%,transparent 55%);transform:translateX(-58%);opacity:0}
.sp-go .sp-sheen i{animation:sp-sheen .44s ease-in-out 1.06s both}
.sp-streak{position:absolute;left:50%;top:50%;width:190vmax;height:3px;margin:-1.5px 0 0 -95vmax;background:linear-gradient(90deg,transparent 34%,#c0141d 47%,#ffe0d8 50%,#c0141d 53%,transparent 66%);box-shadow:0 0 14px rgba(192,20,29,.9);opacity:0;transform:rotate(-24deg) translateX(-62%);will-change:transform}
.sp-go .sp-streak{animation:sp-streak .46s cubic-bezier(.6,0,.3,1) .42s both}
.sp-sparks{left:50%;top:44%;right:auto;bottom:auto;width:0;height:0}
.sp-sparks i{position:absolute;width:15px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff3b2f);opacity:0;transform:rotate(var(--a))}
.sp-go .sp-sparks i{animation:sp-spark .42s ease-out var(--d) both}
.sp-id{position:relative;display:grid;justify-items:center;gap:clamp(7px,1.3vh,12px)}
.sp-name{margin:0;font:800 clamp(44px,13vw,78px)/.95 'Barlow Condensed','Arial Narrow',Impact,sans-serif;letter-spacing:.13em;margin-right:-.13em;text-transform:uppercase;white-space:nowrap;background:linear-gradient(180deg,#f6f0ee 28%,#bda7a3 92%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;clip-path:inset(0 100% 0 0)}
.sp-name span{background:linear-gradient(180deg,#ff3b2f,#c0141d 78%);-webkit-background-clip:text;background-clip:text}
.sp-rule{display:block;width:min(58vw,300px);height:1px;background:linear-gradient(90deg,transparent,#c0141d 22%,#ff3b2f 50%,#c0141d 78%,transparent);transform:scaleX(0);opacity:0}
.sp-tag{margin:0;font:700 clamp(10.5px,2.9vw,14px)/1.2 'Montserrat',system-ui,sans-serif;letter-spacing:.3em;margin-right:-.3em;color:#a89c98;white-space:nowrap;opacity:0;transform:translateY(6px)}
.sp-go .sp-name{animation:sp-name .36s cubic-bezier(.2,.8,.2,1) 1.5s forwards}
.sp-go .sp-rule{animation:sp-rule .34s cubic-bezier(.2,.8,.2,1) 1.62s forwards}
.sp-go .sp-tag{animation:sp-tag .28s ease-out 1.72s forwards}
.sp-skip{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));padding:10px 12px;border:0;background:none;color:#a89c98;font:700 11px/1 'Montserrat',system-ui,sans-serif;letter-spacing:.18em;cursor:pointer;opacity:0;transition:opacity .3s}
.sp-go .sp-skip,.sp-calm .sp-skip{opacity:.8}
.sp-skip:focus-visible{outline:2px solid #ff3b2f;opacity:1}
/* reduced motion or the short intro: the finished picture, only faded */
.sp-calm .sp-emb{clip-path:none;transform:none}.sp-calm .sp-rim{opacity:1}.sp-calm .sp-halo{opacity:1}.sp-calm .sp-smoke{opacity:1}
.sp-calm .sp-name,.sp-calm .sp-tag{opacity:1;clip-path:none;transform:none}.sp-calm .sp-rule{opacity:1;transform:none}
#splash.sp-fade{animation:none;opacity:0;transition:opacity .24s linear;pointer-events:none}
/* the entry: a red slash, and the splash wiped away behind it */
#splash.sp-exit{animation:sp-wipe .46s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
#sp-slash{position:fixed;z-index:101;top:-12vh;bottom:-12vh;left:0;width:30vw;min-width:150px;pointer-events:none;opacity:0;transform:translateX(-65vw) skewX(-8deg);background:linear-gradient(90deg,transparent,rgba(192,20,29,.5) 34%,#c0141d 47%,#ffc9bd 50%,#c0141d 53%,rgba(192,20,29,.34) 68%,transparent)}
#sp-slash.sp-exit{animation:sp-slash .46s cubic-bezier(.7,0,.2,1) forwards}
.sp-fail{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:12px;padding:24px;text-align:center;font:600 15px/1.4 'Montserrat',system-ui,sans-serif;color:#f6f0ee}
.sp-fail a{color:#ff3b2f;font-weight:700}
@keyframes sp-in{to{opacity:1}}
@keyframes sp-drift1{to{transform:translate(9vmax,-3vmax)}}
@keyframes sp-drift2{to{transform:translate(-8vmax,4vmax)}}
@keyframes sp-drift3{to{transform:translate(5vmax,-6vmax)}}
@keyframes sp-dust{0%{opacity:0;transform:none}24%{opacity:var(--o)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@keyframes sp-beam{0%{opacity:0}34%{opacity:1}100%{opacity:.42}}
@keyframes sp-reveal{to{clip-path:polygon(-40% -10%,170% -10%,140% 110%,-70% 110%)}}
@keyframes sp-settle{to{transform:scale(1)}}
@keyframes sp-wake{to{opacity:1}}
@keyframes sp-pulse{0%{opacity:0;transform:scale(.72)}30%{opacity:.95}100%{opacity:0;transform:scale(1.5)}}
@keyframes sp-sheen{0%{opacity:0;transform:translateX(-58%)}18%{opacity:1}82%{opacity:1}100%{opacity:0;transform:translateX(58%)}}
@keyframes sp-streak{0%{opacity:0;transform:rotate(-24deg) translateX(-62%)}12%{opacity:1}86%{opacity:1}100%{opacity:0;transform:rotate(-24deg) translateX(62%)}}
@keyframes sp-spark{0%{opacity:0;transform:rotate(var(--a)) translateX(0)}30%{opacity:.9}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--l))}}
@keyframes sp-name{to{opacity:1;clip-path:inset(-10% -4% -10% 0)}}
@keyframes sp-rule{to{opacity:1;transform:none}}
@keyframes sp-tag{to{opacity:1;transform:none}}
@keyframes sp-wipe{from{clip-path:polygon(calc(-50% + 7vh) 0,220% 0,220% 100%,calc(-50% - 7vh) 100%)}to{clip-path:polygon(calc(130% + 7vh) 0,220% 0,220% 100%,calc(130% - 7vh) 100%)}}
@keyframes sp-slash{0%{opacity:1;transform:translateX(-65vw) skewX(-8deg)}100%{opacity:1;transform:translateX(115vw) skewX(-8deg)}}
</style>

<body>
<div id="splash">
  <div class="sp-smoke" aria-hidden="true"><b></b><b></b><b></b></div>
  <div class="sp-dust" aria-hidden="true"><i style="--x:45%;--y:25%;--s:3px;--o:0.55;--d:49ms;--dx:-31px;--dy:-38px"></i><i style="--x:72%;--y:18%;--s:2px;--o:0.55;--d:59ms;--dx:24px;--dy:-77px"></i><i style="--x:8%;--y:17%;--s:3px;--o:0.4;--d:71ms;--dx:-10px;--dy:-85px"></i><i style="--x:74%;--y:60%;--s:1.5px;--o:0.55;--d:126ms;--dx:-12px;--dy:-50px"></i><i style="--x:84%;--y:80%;--s:1.5px;--o:0.55;--d:599ms;--dx:10px;--dy:-87px"></i><i style="--x:32%;--y:11%;--s:2px;--o:0.4;--d:429ms;--dx:-22px;--dy:-56px"></i><i style="--x:19%;--y:79%;--s:2px;--o:0.55;--d:185ms;--dx:-27px;--dy:-53px"></i><i style="--x:77%;--y:87%;--s:2px;--o:0.4;--d:99ms;--dx:30px;--dy:-45px"></i><i style="--x:12%;--y:78%;--s:1.5px;--o:0.55;--d:210ms;--dx:23px;--dy:-47px"></i><i style="--x:72%;--y:60%;--s:2px;--o:0.4;--d:599ms;--dx:18px;--dy:-67px"></i><i style="--x:42%;--y:37%;--s:2px;--o:0.55;--d:249ms;--dx:-30px;--dy:-54px"></i><i style="--x:42%;--y:73%;--s:3px;--o:0.4;--d:459ms;--dx:-4px;--dy:-52px"></i><i style="--x:13%;--y:21%;--s:3px;--o:0.3;--d:350ms;--dx:-21px;--dy:-31px"></i><i style="--x:66%;--y:59%;--s:1.5px;--o:0.55;--d:79ms;--dx:57px;--dy:-55px"></i></div>
  <div class="sp-beam" aria-hidden="true"></div>
  <div class="sp-cam">
    <div class="sp-stage" aria-hidden="true">
      <div class="sp-halo"></div>
      <div class="sp-pulse"></div>
      <div class="sp-emb">
        <div class="sp-rim"><img src="splash/emblem.webp" alt="" width="680" height="801" decoding="sync"></div>

</div>
<div id="sp-slash" aria-hidden="true"></div>
<div id="app"></div>
<div id="ov"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Plays on a fresh launch only: the page stays loaded while you move around the app, and a reload in the same session skips it.
// main.ts builds the dashboard underneath at the same time, so the exit only waits if that is genuinely not ready.
(function () {
  var sp = document.getElementById('splash'), slash = document.getElementById('sp-slash');
  if (!sp) return;
  var mode = 'full', seen = false;
  try { mode = localStorage.getItem('beast:opening') || 'full'; } catch (e) { /* storage blocked */ }
  try { seen = sessionStorage.getItem('beast:opened') === '1'; sessionStorage.setItem('beast:opened', '1'); } catch (e) { /* storage blocked */ }
  function drop() { sp.remove(); if (slash) slash.remove(); }
  if (seen || mode === 'off') { drop(); return; }
  var calm = mode === 'short' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  var HOLD = calm ? 800 : 2000, LIMIT = 6000;
  var t0 = 0, started = false, leaving = false, broken = false;
  function ready() { var a = document.getElementById('app'); return !!a && a.children.length > 0; }
  addEventListener('error', function (e) { if (e.error || (e.target && e.target.tagName === 'SCRIPT')) broken = true; }, true);
  function leave() {
    if (leaving) return;
    if (!ready() && !broken && performance.now() - t0 < LIMIT) { setTimeout(leave, 60); return; }
    leaving = true;
    if (!ready()) {
      var a = document.getElementById('app');
      if (a) a.innerHTML = '<div class="sp-fail"><p>Aplicația nu s-a putut încărca.</p><a href="./">Încearcă din nou</a></div>';
    }
    sp.classList.remove('sp-go', 'sp-calm');
    sp.classList.add(calm ? 'sp-fade' : 'sp-exit');
    if (calm) sp.classList.add('sp-calm'); else if (slash) slash.classList.add('sp-exit');
    setTimeout(drop, calm ? 280 : 480);
  }
  function go() {
    if (started) return;
    started = true;
    t0 = performance.now();
    sp.classList.add(calm ? 'sp-calm' : 'sp-go');
    setTimeout(leave, HOLD);
  }
  // Starts once the wolf is decoded and main.ts has drawn the dashboard, so that work does not stutter the animation.
  // Neither may hold it back: after half a second it runs anyway, and the screen until then is scene 1's darkness.
  var boot = performance.now(), loaded = false;
  function arm() {
    if (started) return;
    if ((loaded && ready()) || performance.now() - boot > 500) { requestAnimationFrame(go); return; }
    setTimeout(arm, 25);
  }
  var im = new Image();
  im.onload = im.onerror = function () { loaded = true; };
  im.src = 'splash/emblem.webp';
  arm();
  function skip() { if (!started) go(); t0 = t0 || performance.now(); leave(); }
  sp.addEventListener('click', skip);
  addEventListener('keydown', function k(e) {
    if (!sp.isConnected) { removeEventListener('keydown', k); return; }
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') skip();
  });
})();
</script>
